info:
  name: login
  type: http
  seq: 1

http:
  method: POST
  url: "{{API_URL}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "andressa@toastlabs.com.br",
        "password": "password"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const responseBody = res.getBody();
        const accessToken = responseBody.access_token;

        bru.setEnvVar("access_token", accessToken);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
